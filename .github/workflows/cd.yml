name: Continuous Deployment

on:
  push:
    branches: [ main, master ]

env:
  REGISTRY_LOGIN_SERVER: ${{ secrets.REGISTRY_LOGIN_SERVER }}
  RESOURCE_GROUP: "aegisvault-rg"
  ENVIRONMENT_NAME: "aegisvault-env"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # 1. Build and Push Auth Service
      - name: Build and Push Auth Service
        run: |
          docker build -t ${{ env.REGISTRY_LOGIN_SERVER }}/auth-service:${{ github.sha }} -t ${{ env.REGISTRY_LOGIN_SERVER }}/auth-service:latest -f ./services/auth-service/Dockerfile ./services/auth-service
          docker push ${{ env.REGISTRY_LOGIN_SERVER }}/auth-service --all-tags

      # 2. Build and Push Account Service
      - name: Build and Push Account Service
        run: |
          docker build -t ${{ env.REGISTRY_LOGIN_SERVER }}/account-service:${{ github.sha }} -t ${{ env.REGISTRY_LOGIN_SERVER }}/account-service:latest -f ./services/account-service/Dockerfile ./services/account-service
          docker push ${{ env.REGISTRY_LOGIN_SERVER }}/account-service --all-tags

      # 3. Build and Push Transaction Service
      - name: Build and Push Transaction Service
        run: |
          docker build -t ${{ env.REGISTRY_LOGIN_SERVER }}/transaction-service:${{ github.sha }} -t ${{ env.REGISTRY_LOGIN_SERVER }}/transaction-service:latest -f ./services/transaction-service/Dockerfile ./services/transaction-service
          docker push ${{ env.REGISTRY_LOGIN_SERVER }}/transaction-service --all-tags

      # 4. Build and Push Notification Service
      - name: Build and Push Notification Service
        run: |
          docker build -t ${{ env.REGISTRY_LOGIN_SERVER }}/notification-service:${{ github.sha }} -t ${{ env.REGISTRY_LOGIN_SERVER }}/notification-service:latest -f ./services/notification-service/Dockerfile ./services/notification-service
          docker push ${{ env.REGISTRY_LOGIN_SERVER }}/notification-service --all-tags

      # 5. Build and Push Admin Service
      - name: Build and Push Admin Service
        run: |
          docker build -t ${{ env.REGISTRY_LOGIN_SERVER }}/admin-service:${{ github.sha }} -t ${{ env.REGISTRY_LOGIN_SERVER }}/admin-service:latest -f ./services/admin-service/Dockerfile ./services/admin-service
          docker push ${{ env.REGISTRY_LOGIN_SERVER }}/admin-service --all-tags

      # 6. Build and Push API Gateway
      - name: Build and Push API Gateway
        run: |
          docker build -t ${{ env.REGISTRY_LOGIN_SERVER }}/api-gateway:${{ github.sha }} -t ${{ env.REGISTRY_LOGIN_SERVER }}/api-gateway:latest -f ./services/api-gateway/Dockerfile ./services/api-gateway
          docker push ${{ env.REGISTRY_LOGIN_SERVER }}/api-gateway --all-tags

      # 7. Build and Push Client (Next.js)
      - name: Build and Push Client Frontend
        run: |
          docker build -t ${{ env.REGISTRY_LOGIN_SERVER }}/client:${{ github.sha }} -t ${{ env.REGISTRY_LOGIN_SERVER }}/client:latest -f ./client/Dockerfile ./client
          docker push ${{ env.REGISTRY_LOGIN_SERVER }}/client --all-tags

      # 8. Build and Push Postgres
      - name: Build and Push Postgres Database
        run: |
          docker build -t ${{ env.REGISTRY_LOGIN_SERVER }}/postgres:${{ github.sha }} -t ${{ env.REGISTRY_LOGIN_SERVER }}/postgres:latest -f ./databases/postgres/Dockerfile .
          docker push ${{ env.REGISTRY_LOGIN_SERVER }}/postgres --all-tags

      # 9. Deploy to Azure Container Apps
      - name: Deploy to Azure Container Apps
        run: |
          echo "🔑 Attaching Registry Credentials..."
          APPS=("postgres" "redis" "auth-service" "account-service" "transaction-service" "notification-service" "admin-service" "api-gateway" "client")
          for app in "${APPS[@]}"; do
            az containerapp registry set --name $app --resource-group ${{ env.RESOURCE_GROUP }} --server ${{ env.REGISTRY_LOGIN_SERVER }} --username ${{ secrets.REGISTRY_USERNAME }} --password ${{ secrets.REGISTRY_PASSWORD }}
          done

          echo "🌐 Fetching Internal Service URLs..."
          PG_FQDN=$(az containerapp show -n postgres -g ${{ env.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)
          REDIS_FQDN=$(az containerapp show -n redis -g ${{ env.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)
          AUTH_URL="https://$(az containerapp show -n auth-service -g ${{ env.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)"
          ACCT_URL="https://$(az containerapp show -n account-service -g ${{ env.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)"
          TX_URL="https://$(az containerapp show -n transaction-service -g ${{ env.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)"
          NOTIF_URL="https://$(az containerapp show -n notification-service -g ${{ env.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)"
          ADMIN_URL="https://$(az containerapp show -n admin-service -g ${{ env.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)"
          API_GW_URL="https://$(az containerapp show -n api-gateway -g ${{ env.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)"

          echo "⚙️ Setting Shared Environment Variables..."
          JWT_SECRET="aegisvault-super-secret-jwt-key-2026"
          DB_BASE="postgresql://aegis_admin:securep@ss123@${PG_FQDN}:5432/aegisvault"
          REDIS_URL="redis://${REDIS_FQDN}:6379"

          echo "🚀 Deploying Databases..."
          az containerapp update --name postgres --resource-group ${{ env.RESOURCE_GROUP }} --image ${{ env.REGISTRY_LOGIN_SERVER }}/postgres:${{ github.sha }}
          az containerapp update --name redis --resource-group ${{ env.RESOURCE_GROUP }} --image redis:7-alpine

          echo "🚀 Deploying Microservices..."
          az containerapp update --name auth-service --resource-group ${{ env.RESOURCE_GROUP }} --image ${{ env.REGISTRY_LOGIN_SERVER }}/auth-service:${{ github.sha }} --set-env-vars DATABASE_URL="${DB_BASE}?schema=auth_db" REDIS_URL=$REDIS_URL JWT_SECRET=$JWT_SECRET JWT_ACCESS_EXPIRES_IN="15m" JWT_REFRESH_EXPIRES_IN="7d" NOTIFICATION_SERVICE_URL=$NOTIF_URL
          az containerapp update --name account-service --resource-group ${{ env.RESOURCE_GROUP }} --image ${{ env.REGISTRY_LOGIN_SERVER }}/account-service:${{ github.sha }} --set-env-vars DATABASE_URL="${DB_BASE}?schema=acct_db"
          az containerapp update --name transaction-service --resource-group ${{ env.RESOURCE_GROUP }} --image ${{ env.REGISTRY_LOGIN_SERVER }}/transaction-service:${{ github.sha }} --set-env-vars DATABASE_URL="${DB_BASE}?schema=tx_db" ACCOUNT_SERVICE_URL=$ACCT_URL NOTIFICATION_SERVICE_URL=$NOTIF_URL
          az containerapp update --name notification-service --resource-group ${{ env.RESOURCE_GROUP }} --image ${{ env.REGISTRY_LOGIN_SERVER }}/notification-service:${{ github.sha }} --set-env-vars DATABASE_URL="${DB_BASE}?schema=notif_db" SMTP_HOST="smtp.mailtrap.io" SMTP_PORT="2525" SMTP_USER="user" SMTP_PASS="pass" SMTP_FROM="noreply@aegisvault.com"
          az containerapp update --name admin-service --resource-group ${{ env.RESOURCE_GROUP }} --image ${{ env.REGISTRY_LOGIN_SERVER }}/admin-service:${{ github.sha }} --set-env-vars DATABASE_URL="${DB_BASE}?schema=admin_db" AUTH_SERVICE_URL=$AUTH_URL TRANSACTION_SERVICE_URL=$TX_URL
          az containerapp update --name api-gateway --resource-group ${{ env.RESOURCE_GROUP }} --image ${{ env.REGISTRY_LOGIN_SERVER }}/api-gateway:${{ github.sha }} --set-env-vars JWT_SECRET=$JWT_SECRET REDIS_URL=$REDIS_URL AUTH_SERVICE_URL=$AUTH_URL ACCOUNT_SERVICE_URL=$ACCT_URL TRANSACTION_SERVICE_URL=$TX_URL NOTIFICATION_SERVICE_URL=$NOTIF_URL ADMIN_SERVICE_URL=$ADMIN_URL
          
          echo "🚀 Deploying Client..."
          az containerapp update --name client --resource-group ${{ env.RESOURCE_GROUP }} --image ${{ env.REGISTRY_LOGIN_SERVER }}/client:${{ github.sha }} --set-env-vars INTERNAL_API_URL=$API_GW_URL NEXT_PUBLIC_API_URL="/api"

      # 10. Run Database Seed via Azure Container App Job
      - name: Seed Database
        run: |
          echo "🌱 Creating Seed Job in Azure Container Apps..."
          
          az containerapp job delete --name db-seed-job --resource-group ${{ env.RESOURCE_GROUP }} --yes || true

          az containerapp job create \
            --name db-seed-job \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --environment ${{ env.ENVIRONMENT_NAME }} \
            --trigger-type Manual \
            --replica-timeout 300 \
            --image node:20-alpine \
            --command "/bin/sh" "-c" "wget -qO- https://raw.githubusercontent.com/sandaruns2004/Duothon_6.0_BigBug/main/scripts/run-seed.sh | sh"
          
          echo "▶️ Starting the Seed Job..."
          az containerapp job start --name db-seed-job --resource-group ${{ env.RESOURCE_GROUP }}
